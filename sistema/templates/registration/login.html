{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · PreVet</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">

    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>

    {# El dibujo de la huellita se define una vez y se reutiliza abajo. #}
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="huella" viewBox="0 0 24 24"><path d="M8.35 3c1.18 0 2.14 1.4 2.14 3.12S9.53 9.25 8.35 9.25 6.2 7.85 6.2 6.13 7.17 3 8.35 3zm7.3 0c1.18 0 2.15 1.4 2.15 3.12s-.97 3.13-2.15 3.13-2.14-1.4-2.14-3.13S14.47 3 15.65 3zM3.8 8.2c1.05 0 1.9 1.22 1.9 2.72s-.85 2.72-1.9 2.72-1.9-1.22-1.9-2.72S2.75 8.2 3.8 8.2zm16.4 0c1.05 0 1.9 1.22 1.9 2.72s-.85 2.72-1.9 2.72-1.9-1.22-1.9-2.72.85-2.72 1.9-2.72zM12 11.4c2.5 0 4.2 1.9 5.5 3.6 1 1.35 2.2 2.4 2.2 4 0 2.1-1.7 3.4-3.7 3.4-1.6 0-2.9-.7-4-.7s-2.4.7-4 .7c-2 0-3.7-1.3-3.7-3.4 0-1.6 1.2-2.65 2.2-4 1.3-1.7 3-3.6 5.5-3.6z"/></symbol>
        <symbol id="persona" viewBox="0 0 24 24"><path d="M12 12a4.5 4.5 0 100-9 4.5 4.5 0 000 9zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5z"/></symbol>
        <symbol id="candado" viewBox="0 0 24 24"><path d="M17 9V7A5 5 0 007 7v2a2 2 0 00-2 2v9a2 2 0 002 2h10a2 2 0 002-2v-9a2 2 0 00-2-2zm-8-2a3 3 0 016 0v2H9V7zm4 9.7V18h-2v-1.3a2 2 0 112 0z"/></symbol>
    </svg>

    <svg class="huella-fondo huella-1" viewBox="0 0 24 24" aria-hidden="true"><use href="#huella"/></svg>
    <svg class="huella-fondo huella-2" viewBox="0 0 24 24" aria-hidden="true"><use href="#huella"/></svg>
    <svg class="huella-fondo huella-3" viewBox="0 0 24 24" aria-hidden="true"><use href="#huella"/></svg>
    <svg class="huella-fondo huella-4" viewBox="0 0 24 24" aria-hidden="true"><use href="#huella"/></svg>
    <svg class="huella-fondo huella-5" viewBox="0 0 24 24" aria-hidden="true"><use href="#huella"/></svg>
    <svg class="huella-fondo huella-6" viewBox="0 0 24 24" aria-hidden="true"><use href="#huella"/></svg>
    <svg class="huella-fondo huella-7" viewBox="0 0 24 24" aria-hidden="true"><use href="#huella"/></svg>
    <svg class="huella-fondo huella-8" viewBox="0 0 24 24" aria-hidden="true"><use href="#huella"/></svg>

    <div class="camino" aria-hidden="true">
        <svg class="pisada" viewBox="0 0 24 24"><use href="#huella"/></svg>
        <svg class="pisada" viewBox="0 0 24 24"><use href="#huella"/></svg>
        <svg class="pisada" viewBox="0 0 24 24"><use href="#huella"/></svg>
        <svg class="pisada" viewBox="0 0 24 24"><use href="#huella"/></svg>
        <svg class="pisada" viewBox="0 0 24 24"><use href="#huella"/></svg>
        <svg class="pisada" viewBox="0 0 24 24"><use href="#huella"/></svg>
        <svg class="pisada" viewBox="0 0 24 24"><use href="#huella"/></svg>
        <svg class="pisada" viewBox="0 0 24 24"><use href="#huella"/></svg>
    </div>

    <main class="tarjeta">

        <div class="marca">
            <div class="marca-logo"><svg viewBox="0 0 24 24"><use href="#huella"/></svg></div>
            <div class="marca-nombre">Pre<span>Vet</span></div>
        </div>
        <p class="frase">Porque cuidarlos empieza por estar ahí</p>

        {% if form.errors %}
        <div class="error">Usuario o contraseña incorrectos. Inténtalo de nuevo.</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="campo">
                <label for="id_username" class="oculto">Usuario</label>
                <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#persona"/></svg>
                <input type="text" name="username" id="id_username" placeholder="Usuario"
                       autocomplete="username" autofocus required>
            </div>

            <div class="campo">
                <label for="id_password" class="oculto">Contraseña</label>
                <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#candado"/></svg>
                <input type="password" name="password" id="id_password" placeholder="Contraseña"
                       autocomplete="current-password" required>
            </div>

            <button type="submit" class="boton">Entrar</button>

            <input type="hidden" name="next" value="{{ next }}">
        </form>

        <div class="pie"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#huella"/></svg></div>

    </main>

</body>
</html>
